services:
  db:
    image: postgres:16-alpine
    container_name: ssm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ssm_user
      POSTGRES_PASSWORD: ssm_password_change_me
      POSTGRES_DB: ssm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssm_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://ssm_user:ssm_password_change_me@db:5432/ssm_db?schema=public"
      NODE_ENV: production
      STORAGE_DIR: "/app/storage"
    depends_on:
      - db
    volumes:
      - app_storage:/app/storage

volumes:
  postgres_data:
  app_storage:
